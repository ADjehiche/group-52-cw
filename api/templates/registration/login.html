<!DOCTYPE html>
<html>
  <body>
    <h1>Login</h1>

    {% if form.errors %}
    <p style="color: red">Invalid username/password</p>
    {% endif %}

    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>

    <p style="margin-top: 1rem">
      Don't have an account?
      <a href="/accounts/signup/">Sign up</a>
    </p>
  </body>
</html>
