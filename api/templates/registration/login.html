{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'api/auth.css' %}" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="brand">
        <div class="brand-mark">AU</div>
        <div>
          <h1>Welcome back</h1>
          <p class="description">
            Sign in to continue bidding and tracking your items.
          </p>
        </div>
      </div>

      {% if form.errors %}
      <div class="alert">Invalid username or password. Please try again.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">Log in</button>
      </form>

      <div class="links">
        <span class="small">New here?</span>
        <a href="{% url 'signup' %}">Create an account</a>
      </div>
    </div>
  </body>
</html>
